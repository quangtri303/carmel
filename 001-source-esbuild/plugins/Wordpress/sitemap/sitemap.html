<script>
	// JS to add functionality to the tree view
	document.addEventListener("DOMContentLoaded", function () {
		const treeContainer = document.getElementById("sitemapContainer");
		// Find all list items that have a nested list
		const parentItems = treeContainer.querySelectorAll("li");

		parentItems.forEach((item) => {
			const subMenu = item.querySelector("ul");
			if (subMenu) {
				// Create the toggle button
				const toggleBtn = document.createElement("span");
				toggleBtn.className = "Sitemap-TreeView-Collapse"; // Default to collapsed/collapsible style

				// Add click event
				toggleBtn.onclick = function (e) {
					e.stopPropagation(); // Prevent triggering link click if any

					// Toggle the button class
					if (this.classList.contains("Sitemap-TreeView-Collapse")) {
						this.classList.remove("Sitemap-TreeView-Collapse");
						this.classList.add("Sitemap-TreeView-Expand");

						// Hide the submenu
						subMenu.classList.add("Sitemap-TreeView-Hide");
						subMenu.classList.remove("Sitemap-TreeView-Show");
					} else {
						this.classList.remove("Sitemap-TreeView-Expand");
						this.classList.add("Sitemap-TreeView-Collapse");

						// Show the submenu
						subMenu.classList.remove("Sitemap-TreeView-Hide");
						subMenu.classList.add("Sitemap-TreeView-Show");
					}
				};

				// Add the button to the list item
				item.appendChild(toggleBtn);

				// Mark as parent for specific styling if needed
				item.classList.add("Sitemap-TreeView-Parent");
			}
		});

		// Add root class for responsive styling
		const rootUl = treeContainer.querySelector(":scope > ul");
		if (rootUl) {
			const rootLis = rootUl.querySelectorAll(":scope > li");
			rootLis.forEach((li) => li.classList.add("Sitemap-TreeView-Root"));
		}
	});
</script>
